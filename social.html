<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeerVerse - Social</title>
  <link rel="stylesheet" href="style.css">

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    :root {
      --bg: #0d0d0d;
      --panel: #141414;
      --border: #2a2a2a;
      --text: #fff;
      --text-muted: #aaa;
      --accent: #00bcd4;
      --heart: #ff3860;
      --hazard-red: #ff4444;
    }
    * {margin:0;padding:0;box-sizing:border-box;}
    body {font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);}

    /* HEADER
    .header {position:fixed;top:0;left:0;right:0;height:60px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;z-index:1000;}
    .header-content {width:100%;max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;padding:0 16px;}
    .logo {font-size:22px;font-weight:700;color:var(--accent);text-decoration:none;}

    .search-container {flex:1;max-width:300px;position:relative;margin:0 20px;}
    .search-input {width:100%;padding:8px 12px 8px 40px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);}
    .search-icon {position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);} */

    /* STORIES */
    .stories {display:flex;overflow-x:auto;gap:12px;padding:80px 16px 16px;border-bottom:1px solid var(--border);scrollbar-width:none;}
    .stories::-webkit-scrollbar {display:none;}
    .story {flex:0 0 auto;text-align:center;color:var(--text-muted);}
    .story-ring {width:72px;height:72px;border-radius:50%;background:linear-gradient(45deg,var(--accent),#00e5ff);padding:2px;margin-bottom:6px;}
    .story img {width:68px;height:68px;border-radius:50%;object-fit:cover;border:2px solid var(--panel);}
    .story span {font-size:12px;}

    /* FEED */
    .feed {max-width:1100px;margin:20px auto 80px;padding:0 16px;display:grid;grid-template-columns:1fr;gap:28px;}
    @media(min-width:768px){.feed{grid-template-columns:1fr 1fr;}}
    @media(min-width:1200px){.feed{grid-template-columns:1fr 1fr 1fr;}}

    /* POST */
    .post {background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
    .post-header {display:flex;align-items:center;justify-content:space-between;padding:12px 16px;}
    .post-user {display:flex;align-items:center;gap:12px;}
    .post-avatar {width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);}
    .post-username {font-weight:600;}
    .hazard-badge {background:var(--hazard-red);color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;margin-left:6px;}
    .post-time {font-size:12px;color:var(--text-muted);}
    .post-image {width:100%;max-height:450px;object-fit:cover;}
    .post-actions {display:flex;gap:16px;padding:12px 16px 8px;}
    .action-btn {background:none;border:none;font-size:20px;color:var(--text);cursor:pointer;}
    .action-btn.liked {color:var(--heart);}
    .post-likes,.post-caption,.comments {padding:0 16px 8px;font-size:14px;}
    .caption-username {font-weight:600;}
    .comment-input {width:100%;border:none;border-top:1px solid var(--border);background:transparent;padding:8px 12px;color:var(--text);}
    .comment-input:focus {outline:none;}

    /* BOTTOM NAV */
    .bottom-nav {position:fixed;bottom:0;left:0;right:0;height:60px;background:var(--panel);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;z-index:1000;}
    .bottom-nav button {background:none;border:none;font-size:22px;color:var(--text);cursor:pointer;}
    .bottom-nav button.active,.bottom-nav button:hover {color:var(--accent);}

    /* MODAL */
    .modal {position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);display:none;justify-content:center;align-items:center;z-index:2000;}
    .modal-content {background:var(--panel);padding:20px;border-radius:12px;max-width:400px;width:90%;text-align:center;}
    .modal-content input,.modal-content textarea {width:100%;margin-bottom:10px;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);}
    .modal-content button {padding:8px 12px;background:var(--accent);border:none;border-radius:6px;color:#fff;cursor:pointer;}
  </style>
</head>
<body>
 <header class="header" role="banner">
  <div class="header-content">
    <a href="index.html" class="brand" aria-label="NeerVerse Home">
      <span class="brand-text">NeerVerse</span>
    </a>

    <nav role="navigation">
      <ul class="nav-menu">
        <li><a href="index.html#Home" class="nav-link">Home</a></li>
        <li><a href="index.html#Report" class="nav-link">Report Hazard</a></li>
        <li><a href="weather.html" class="nav-link">Maps</a></li>
        <li><a href="social.html" class="nav-link">Social Media</a></li>
      </ul>
    </nav>

    <div class="header-actions">
      <div class="social-bar">
        <button class="social-button" aria-label="Twitter" title="Follow us on Twitter">
          <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        </button>
        <button class="social-button" aria-label="GitHub" title="View on GitHub">
          <svg viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
        </button>
        <button class="social-button" aria-label="LinkedIn" title="Connect on LinkedIn">
          <svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
        </button>
      </div>
      <div class="auth-group">
        <a href="login.html" class="btn btn-text">Sign in</a>
        <a href="index.html#getstarted" class="btn btn-primary">Get started</a>
      </div>
    </div>
  </div>
</header>





  <!-- STORIES -->
  <section class="stories">
    <div class="story"><div class="story-ring"><img src="https://picsum.photos/100?1"></div><span>Your story</span></div>
    <div class="story"><div class="story-ring"><img src="https://picsum.photos/100?2"></div><span>emergency_alerts</span></div>
    <div class="story"><div class="story-ring"><img src="https://picsum.photos/100?3"></div><span>priya_designs</span></div>
  </section>

  <!-- FEED -->
  <main class="feed" id="feedContainer"></main>

  <!-- POST MODAL -->
  <div class="modal" id="postModal">
    <div class="modal-content">
      <h3>Create Post</h3>
      <textarea id="newCaption" placeholder="Write a caption..."></textarea>
      <input type="file" id="newImage" accept="image/*">
      <button onclick="submitPost()">Post</button>
      <button onclick="closeModal()" style="background:#555;margin-left:10px;">Cancel</button>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="active"><i class="fa fa-home"></i></button>
    <button><i class="fa fa-search"></i></button>
    <button id="openPost"><i class="fa fa-plus-square"></i></button>
    <button><i class="fa fa-bell"></i></button>
    <button><i class="fa fa-user"></i></button>
  </nav>

  <script>
    let posts = [
      {
        id:1,
        user:{username:'emergency_alerts',avatar:'https://picsum.photos/50?4'},
        image:'https://picsum.photos/600/400?random=1',
        caption:'🚨 FLASH FLOOD WARNING in Mumbai. Stay safe!',
        likes:5,
        comments:[]
      }
    ];

    const feed = document.getElementById('feedContainer');
    const modal = document.getElementById('postModal');
    const openPostBtn = document.getElementById('openPost');

    openPostBtn.onclick = ()=> modal.style.display='flex';
    function closeModal(){modal.style.display='none';}

    function renderPosts(){
      feed.innerHTML='';
      posts.forEach((p,i)=>{
        let div=document.createElement('div');
        div.className='post';
        div.innerHTML=`
          <div class="post-header">
            <div class="post-user">
              <img src="${p.user.avatar}" class="post-avatar">
              <span class="post-username">${p.user.username}</span>
            </div>
          </div>
          ${p.image?`<img src="${p.image}" class="post-image">`:''}
          <div class="post-actions">
            <button class="action-btn ${p.liked?'liked':''}" onclick="toggleLike(${i},this)"><i class="fa fa-heart"></i></button>
            <button class="action-btn"><i class="fa fa-comment"></i></button>
          </div>
          <div class="post-likes">${p.likes} likes</div>
          <div class="post-caption"><span class="caption-username">${p.user.username}</span> ${p.caption}</div>
          <div class="comments">
            ${p.comments.map(c=>`<div><b>${c.user}</b>: ${c.text}</div>`).join('')}
          </div>
          <input class="comment-input" placeholder="Add a comment..." onkeypress="addComment(event,${i})">
        `;
        feed.appendChild(div);
      });
    }

    function toggleLike(i,btn){
      let p=posts[i];
      if(p.liked){p.likes--;p.liked=false;}
      else{p.likes++;p.liked=true;}
      renderPosts();
    }

    function addComment(e,i){
      if(e.key==='Enter'){
        let text=e.target.value.trim();
        if(!text)return;
        posts[i].comments.push({user:'you',text});
        e.target.value='';
        renderPosts();
      }
    }

    function submitPost(){
      let caption=document.getElementById('newCaption').value.trim();
      let file=document.getElementById('newImage').files[0];
      if(!caption && !file){alert('Add caption or image');return;}
      let newPost={id:Date.now(),user:{username:'you',avatar:'https://picsum.photos/50?self'},image:'',caption,likes:0,comments:[]};
      if(file){
        let reader=new FileReader();
        reader.onload=function(e){
          newPost.image=e.target.result;
          posts.unshift(newPost);
          renderPosts();
          closeModal();
        };
        reader.readAsDataURL(file);
      } else {
        posts.unshift(newPost);
        renderPosts();
        closeModal();
      }
      document.getElementById('newCaption').value='';
      document.getElementById('newImage').value='';
    }

    renderPosts();
  </script>
</body>
</html>
