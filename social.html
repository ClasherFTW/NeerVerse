<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeerVerse - Social</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    :root {
      --bg:#0d0d0d;--panel:#141414;--border:#2a2a2a;--text:#fff;--text-muted:#aaa;
      --accent:#00bcd4;--heart:#ff3860;--hazard-red:#ff4444;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}

    /* HEADER */
    .header{position:fixed;top:0;left:0;right:0;height:60px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;z-index:1000}
    .header-content{width:100%;max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;padding:0 16px}
    .logo{font-size:22px;font-weight:700;background:linear-gradient(45deg,#00e5ff,#00bcd4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none}
    .search-container{flex:1;max-width:300px;position:relative;margin:0 20px}
    .search-input{width:100%;padding:8px 12px 8px 40px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text)}
    .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted)}
    .header-actions{display:flex;align-items:center;gap:12px}
    .header-actions button{background:none;border:none;font-size:20px;color:var(--text);cursor:pointer}

    /* STORIES */
    .stories{display:flex;overflow-x:auto;gap:12px;padding:80px 16px 16px;border-bottom:1px solid var(--border);scrollbar-width:none}
    .stories::-webkit-scrollbar{display:none}
    .story{flex:0 0 auto;text-align:center;color:var(--text-muted);cursor:pointer;position:relative}
    .story-ring{width:72px;height:72px;border-radius:50%;background:linear-gradient(45deg,var(--accent),#00e5ff);padding:2px;margin-bottom:6px;position:relative}
    .story img{width:68px;height:68px;border-radius:50%;object-fit:cover;border:2px solid var(--panel)}
    .story span{font-size:12px}
    .add-icon{position:absolute;bottom:0;right:0;background:var(--panel);border-radius:50%;color:var(--accent);font-size:18px;cursor:pointer}

    /* FEED */
    .feed{max-width:1100px;margin:20px auto 80px;padding:0 16px;display:grid;grid-template-columns:1fr;gap:28px}
    @media(min-width:768px){.feed{grid-template-columns:1fr 1fr}}
    @media(min-width:1200px){.feed{grid-template-columns:1fr 1fr 1fr}}
    .post{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden}
    .post-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
    .post-user{display:flex;align-items:center;gap:12px}
    .post-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--accent)}
    .post-image{width:100%;max-height:450px;object-fit:cover}
    .post-actions{display:flex;gap:16px;padding:12px 16px 8px}
    .action-btn{background:none;border:none;font-size:20px;color:var(--text);cursor:pointer}
    .action-btn.liked{color:var(--heart)}
    .post-likes,.post-caption,.comments{padding:0 16px 8px;font-size:14px}
    .caption-username{font-weight:600}
    .comment-input{width:100%;border:none;border-top:1px solid var(--border);background:transparent;padding:8px 12px;color:var(--text)}
    .comment-input:focus{outline:none}
    .view-comments{padding:0 16px 8px;color:var(--text-muted);font-size:13px;cursor:pointer}

    /* BOTTOM NAV */
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;height:60px;background:var(--panel);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;z-index:1000}
    .bottom-nav button{background:none;border:none;font-size:22px;color:var(--text);cursor:pointer}
    .bottom-nav button.active,.bottom-nav button:hover{color:var(--accent)}

    /* MODALS */
    .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:none;justify-content:center;align-items:center;z-index:2000}
    .modal-content{background:var(--panel);padding:20px;border-radius:12px;max-width:400px;width:90%}
    .modal-content input,.modal-content textarea{width:100%;margin-bottom:10px;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text)}
    .modal-content button{padding:8px 12px;background:var(--accent);border:none;border-radius:6px;color:#fff;cursor:pointer}
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-content">
      <a href="#" class="logo">NeerVerse</a>
      <div class="search-container">
        <i class="fa fa-search search-icon"></i>
        <input type="text" class="search-input" placeholder="Search...">
      </div>
      <div class="header-actions">
        <button><i class="fa fa-plus-square" id="openPost"></i></button>
        <button><i class="fa fa-paper-plane"></i><span class="notification-badge">3</span></button>
        <button><i class="fa fa-bell"></i><span class="notification-badge">7</span></button>
      </div>
    </div>
  </header>

  <!-- STORIES -->
  <section class="stories" id="storiesContainer">
    <div class="story" id="yourStory">
      <div class="story-ring">
        <img src="https://picsum.photos/100?1">
        <i class="fa fa-plus-circle add-icon" id="addStoryIcon"></i>
      </div>
      <span>Your story</span>
    </div>
    <div class="story"><div class="story-ring"><img src="https://picsum.photos/100?2"></div><span>emergency_alerts</span></div>
    <div class="story"><div class="story-ring"><img src="https://picsum.photos/100?3"></div><span>priya_designs</span></div>
  </section>

  <!-- FEED -->
  <main class="feed" id="feedContainer"></main>

  <!-- POST MODAL -->
  <div class="modal" id="postModal">
    <div class="modal-content">
      <h3>Create Post</h3>
      <textarea id="newCaption" placeholder="Write a caption..."></textarea>
      <input type="file" id="newImage" accept="image/*">
      <button onclick="submitPost()">Post</button>
      <button onclick="closeModal()" style="background:#555;margin-left:10px;">Cancel</button>
    </div>
  </div>

  <!-- STORY MODAL -->
  <div class="modal" id="storyModal">
    <div class="modal-content" style="max-width:500px;text-align:center;">
      <h3 id="storyUser"></h3>
      <img id="storyImage" src="" style="width:100%;border-radius:10px;max-height:500px;object-fit:cover">
      <button onclick="closeStory()" style="margin-top:10px;background:#555;">Close</button>
    </div>
  </div>

  <!-- SEARCH MODAL -->
  <div class="modal" id="searchModal">
    <div class="modal-content">
      <h3>Search</h3>
      <input type="text" placeholder="Search users or posts...">
      <button onclick="closeModalById('searchModal')" style="background:#555;">Close</button>
    </div>
  </div>

  <!-- NOTIFICATION MODAL -->
  <div class="modal" id="notifyModal">
    <div class="modal-content">
      <h3>Notifications</h3>
      <ul>
        <li>🚨 New flood alert in Chennai</li>
        <li>❤️ rescue_team liked your post</li>
        <li>💬 citizen_report commented on your post</li>
      </ul>
      <button onclick="closeModalById('notifyModal')" style="background:#555;">Close</button>
    </div>
  </div>

  <!-- PROFILE MODAL -->
  <div class="modal" id="profileModal">
    <div class="modal-content">
      <h3>Your Profile</h3>
      <p><b>Username:</b> you</p>
      <p><b>Posts:</b> <span id="postCount"></span></p>
      <button onclick="closeModalById('profileModal')" style="background:#555;">Close</button>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="active"><i class="fa fa-home"></i></button>
    <button><i class="fa fa-search"></i></button>
    <button><i class="fa fa-plus-square" id="openPostBottom"></i></button>
    <button><i class="fa fa-bell"></i></button>
    <button><i class="fa fa-user"></i></button>
  </nav>

  <script>
  let posts=[ /* posts array as before */ 
    {
      id:1,
      user:{username:'emergency_alerts',avatar:'https://picsum.photos/50?4'},
      image:'https://picsum.photos/600/400?random=1',
      caption:'🚨 FLASH FLOOD WARNING in Mumbai. Stay safe!',
      likes:152,
      comments:[{user:'rahul',text:'Stay safe everyone!'}]
    },
    {
    id:2,
    user:{username:'rescue_team',avatar:'https://picsum.photos/50?5'},
    image:'https://picsum.photos/600/400?random=2',
    caption:'Rescue operations underway near Chennai coast due to heavy floods. Volunteers needed.',
    likes:87,
    comments:[{user:'anita',text:'Where can we join?'}]
  },
  {
    id:3,
    user:{username:'citizen_report',avatar:'https://picsum.photos/50?6'},
    image:'https://picsum.photos/600/400?random=3',
    caption:'Flooded roads in Pune city after heavy rainfall. Citizens advised to stay safe.',
    likes:65,
    comments:[{user:'kiran',text:'Traffic is terrible!'}]
  },
  {
    id:4,
    user:{username:'ngo_relief',avatar:'https://picsum.photos/50?7'},
    image:'https://picsum.photos/600/400?random=4',
    caption:'Relief material distribution starting 5pm at community hall for flood victims.',
    likes:103,
    comments:[{user:'deepa',text:'Thanks for the update 🙏'}]
  },
  {
    id:5,
    user:{username:'cyclone_alerts',avatar:'https://picsum.photos/50?8'},
    image:'https://picsum.photos/600/400?random=5',
    caption:'Cyclone Michaung approaching coastal areas. Evacuations in progress. Stay indoors!',
    likes:229,
    comments:[{user:'ravi',text:'Praying for everyone\'s safety.'}]
  },
  {
    id:6,
    user:{username:'local_news',avatar:'https://picsum.photos/50?9'},
    image:'https://picsum.photos/600/400?random=6',
    caption:'Severe water logging reported near Bandra station. Commuters advised caution.',
    likes:41,
    comments:[{user:'meena',text:'Are train services affected?'}]
  },
  {
    id:7,
    user:{username:'volunteer_group',avatar:'https://picsum.photos/50?10'},
    image:'https://picsum.photos/600/400?random=7',
    caption:'Volunteers distributing food and blankets in Hyderabad flood-affected areas.',
    likes:77,
    comments:[{user:'sai',text:'How can we contribute?'}]
  },
  {
    id:8,
    user:{username:'official_updates',avatar:'https://picsum.photos/50?11'},
    image:'https://picsum.photos/600/400?random=8',
    caption:'Government emergency helpline active for flood victims: 1800-123-456.',
    likes:90,
    comments:[{user:'neha',text:'Thank you for sharing.'}]
  },
  {
    id:9,
    user:{username:'fire_safety',avatar:'https://picsum.photos/50?12'},
    image:'https://picsum.photos/600/400?random=9',
    caption:'Oil spill reported near Visakhapatnam port after heavy rains. Cleanup teams dispatched.',
    likes:54,
    comments:[{user:'amit',text:'That looks serious.'}]
  },
  {
    id:10,
    user:{username:'climate_watch',avatar:'https://picsum.photos/50?13'},
    image:'https://picsum.photos/600/400?random=10',
    caption:'Rising river levels in Assam. Evacuation advisory issued for nearby villages.',
    likes:112,
    comments:[{user:'alok',text:'Where can we relocate safely?'}]
  },
  {
    id:11,
    user:{username:'community_help',avatar:'https://picsum.photos/50?14'},
    image:'https://picsum.photos/600/400?random=11',
    caption:'Community kitchen open for all flood-affected families at central school.',
    likes:138,
    comments:[{user:'priya',text:'We will help serve food!'}]
  }
    // ... rest of posts ...
  ];

  let stories = [
    {user:'emergency_alerts', image:'https://picsum.photos/400/700?random=20'},
    {user:'priya_designs', image:'https://picsum.photos/400/700?random=21'}
  ];

  const feed=document.getElementById('feedContainer');
  const modal=document.getElementById('postModal');
  document.getElementById('openPost').onclick=()=>modal.style.display='flex';
  document.getElementById('openPostBottom').onclick=()=>modal.style.display='flex';
  function closeModal(){modal.style.display='none';}

  function renderPosts(){
    feed.innerHTML='';
    posts.forEach((p,i)=>{
      let div=document.createElement('div');
      div.className='post';
      div.innerHTML=`
        <div class="post-header">
          <div class="post-user"><img src="${p.user.avatar}" class="post-avatar"><span class="post-username">${p.user.username}</span></div>
        </div>
        ${p.image?`<img src="${p.image}" class="post-image">`:''}
        <div class="post-actions">
          <button class="action-btn ${p.liked?'liked':''}" onclick="toggleLike(${i})"><i class="fa fa-heart"></i></button>
          <button class="action-btn" onclick="focusComment(${i})"><i class="fa fa-comment"></i></button>
        </div>
        <div class="post-likes">${p.likes} likes</div>
        <div class="post-caption"><span class="caption-username">${p.user.username}</span> ${p.caption}</div>
        ${p.comments.length>0?`<div class="view-comments" onclick="toggleComments(${i})">View all ${p.comments.length} comments</div>`:''}
        <div class="comments" id="comments-${i}" style="display:none;">
          ${p.comments.map(c=>`<div><b>${c.user}</b>: ${c.text}</div>`).join('')}
        </div>
        <input class="comment-input" id="comment-${i}" placeholder="Add a comment..." onkeypress="addComment(event,${i})">
      `;
      feed.appendChild(div);
    });
    document.getElementById('postCount').innerText = posts.length;
  }

  function toggleLike(i){
    let p=posts[i];
    if(p.liked){p.likes--;p.liked=false;} else{p.likes++;p.liked=true;}
    renderPosts();
  }

  function addComment(e,i){
    if(e.key==='Enter'){
      let text=e.target.value.trim();
      if(!text)return;
      posts[i].comments.push({user:'you',text});
      e.target.value='';
      renderPosts();
      document.getElementById(`comments-${i}`).style.display='block';
    }
  }

  function toggleComments(i){
    let el=document.getElementById(`comments-${i}`);
    el.style.display=el.style.display==='none'?'block':'none';
  }

  function focusComment(i){
    document.getElementById(`comment-${i}`).focus();
  }

  function submitPost(){
    let caption=document.getElementById('newCaption').value.trim();
    let file=document.getElementById('newImage').files[0];
    if(!caption&&!file){alert('Add caption or image');return;}
    let newPost={id:Date.now(),user:{username:'you',avatar:'https://picsum.photos/50?self'},image:'',caption,likes:0,comments:[]};
    if(file){
      let reader=new FileReader();
      reader.onload=e=>{
        newPost.image=e.target.result;
        posts.unshift(newPost);
        renderPosts();
        closeModal();
      };
      reader.readAsDataURL(file);
    } else {
      posts.unshift(newPost);
      renderPosts();
      closeModal();
    }
    document.getElementById('newCaption').value='';
    document.getElementById('newImage').value='';
  }

  // --- STORIES ---
  function openStory(user,img){
    document.getElementById('storyUser').innerText = user;
    document.getElementById('storyImage').src = img;
    document.getElementById('storyModal').style.display='flex';
  }
  function closeStory(){document.getElementById('storyModal').style.display='none';}

  // Add Story icon click
  document.getElementById("addStoryIcon").onclick=function(e){
    e.stopPropagation();
    let input=document.createElement("input");
    input.type="file"; input.accept="image/*";
    input.onchange=ev=>{
      let file=ev.target.files[0];
      if(file){
        let reader=new FileReader();
        reader.onload=img=>{
          stories.unshift({user:'you',image:img.target.result});
          const storyEl=document.createElement("div");
          storyEl.className="story";
          storyEl.innerHTML=`<div class="story-ring"><img src="${img.target.result}"></div><span>you</span>`;
          storyEl.onclick=()=>openStory('you',img.target.result);
          document.getElementById("storiesContainer").insertBefore(storyEl,document.getElementById("storiesContainer").children[1]);
          openStory('you',img.target.result);
        }
        reader.readAsDataURL(file);
      }
    }
    input.click();
  };

  // Make other stories clickable
  document.querySelectorAll("#storiesContainer .story").forEach((s,i)=>{
    if(i>0){
      s.onclick=()=>openStory(stories[i-1].user,stories[i-1].image);
    }
  });

  // FOOTER NAV
  const navBtns=document.querySelectorAll(".bottom-nav button");
  navBtns[0].onclick=()=>renderPosts(); // Home
  navBtns[1].onclick=()=>document.getElementById("searchModal").style.display='flex'; // Search
  navBtns[3].onclick=()=>document.getElementById("notifyModal").style.display='flex'; // Notifications
  navBtns[4].onclick=()=>document.getElementById("profileModal").style.display='flex'; // Profile

  function closeModalById(id){document.getElementById(id).style.display='none';}

  // Auto-change hazard pics
  setInterval(()=>{
    posts.forEach((p,i)=>{
      p.image=`https://picsum.photos/600/400?random=${Math.floor(Math.random()*1000)}`;
    });
    renderPosts();
  },30000);

  renderPosts();
  </script>
</body>
</html>
