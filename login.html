<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Added translation attribute -->
    <title data-translate="login.welcome">Welcome to NeerVerse</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.10.64/build/spline-viewer.js"></script>
    <script type="module" src="firebase-auth.js"></script>
    <!-- Added translation system scripts -->
    <script src="js/translations.js"></script>
    <script src="js/dynamic-translations.js"></script>
    <!-- Added chatbot scripts -->
    <script src="js/chatbot-knowledge.js"></script>
    <script src="js/chatbot.js"></script>
    <script src="js/chatbot-integration.js"></script>
    <link rel="stylesheet" href="css/chatbot.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #000;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
            position: relative;
        }

        /* Left Side - 3D Model */
        .left-side {
            flex: 1;
            min-width: 0;
            position: relative;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: clamp(20px, 4vw, 40px);
            overflow: hidden;
        }

        .brand-section {
            z-index: 10;
            max-width: min(400px, 90%);
            margin-bottom: clamp(30px, 5vh, 50px);
            position: absolute;
            top: 5vh;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            margin-bottom: clamp(15px, 2vw, 20px);
        }

        .brand-logo i {
            font-size: clamp(24px, 3vw, 32px);
            color: #ffffff;
            margin-right: clamp(10px, 1.5vw, 15px);
        }

        .brand-name {
            font-size: clamp(24px, 3vw, 32px);
            font-weight: 700;
            color: #ffffff;
        }

        .brand-subtitle {
            font-size: clamp(14px, 1.5vw, 16px);
            color: #888;
            margin-bottom: clamp(8px, 1vw, 10px);
        }

        .brand-description {
            color: #ccc;
            font-size: clamp(14px, 1.5vw, 16px);
            line-height: 1.6;
            max-width: 100%;
        }

        .spline-container {
            position: absolute;
            left: 45%;
            top: 55%;
            transform: translate(-50%, -50%);
            width: min(70vw, 700px);
            height: min(50vh, 500px);
            max-width: 700px;
            max-height: 500px;
            opacity: 0.8;
        }

        spline-viewer {
            width: 100%;
            height: 150%;
        }

        /* Right Side - Login Form */
        .right-side {
            flex: 1;
            min-width: 0;
            background: #111111;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(20px, 3vw, 40px);
            border-left: 1px solid #333;
            overflow: hidden;
        }

        .login-container {
            width: 100%;
            max-width: min(400px, 90vw);
            margin: auto;
            max-height: 100vh;
            overflow-y: auto;
            padding: 0 5px;
        }

        .login-container::-webkit-scrollbar {
            width: 6px;
        }

        .login-container::-webkit-scrollbar-track {
            background: #1a1a1a;
            border-radius: 3px;
        }

        .login-container::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }

        .login-container::-webkit-scrollbar-thumb:hover {
            background: #444;
        }

        .welcome-header {
            text-align: center;
            margin-bottom: clamp(25px, 3vw, 30px);
        }

        .welcome-title {
            color: #ffffff;
            font-size: clamp(22px, 2.8vw, 26px);
            font-weight: 700;
            margin-bottom: clamp(6px, 1vw, 8px);
        }

        .welcome-subtitle {
            color: #888;
            font-size: clamp(12px, 1.3vw, 14px);
        }

        /* Tab Navigation */
        .auth-tabs {
            display: flex;
            background: #1a1a1a;
            border-radius: 8px;
            padding: 4px;
            margin-bottom: clamp(20px, 2.5vw, 25px);
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: #888;
            padding: clamp(8px, 1.2vw, 10px);
            border-radius: 6px;
            cursor: pointer;
            font-size: clamp(12px, 1.3vw, 13px);
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: #ffffff;
            color: #000;
        }

        /* Form Styles */
        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: clamp(15px, 1.8vw, 18px);
        }

        .form-label {
            display: block;
            color: #ffffff;
            font-size: clamp(11px, 1.2vw, 12px);
            font-weight: 500;
            margin-bottom: clamp(5px, 0.8vw, 6px);
        }

        .form-input {
            width: 100%;
            padding: clamp(10px, 1.3vw, 12px) clamp(12px, 1.4vw, 14px);
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #ffffff;
            font-size: clamp(12px, 1.3vw, 13px);
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #ffffff;
            background: #222;
        }

        .form-input::placeholder {
            color: #666;
        }

        .login-type-selector {
            display: flex;
            background: #1a1a1a;
            border-radius: 8px;
            margin-bottom: clamp(15px, 1.8vw, 18px);
            overflow: hidden;
        }

        .login-type-btn {
            flex: 1;
            background: none;
            border: none;
            color: #888;
            padding: clamp(8px, 1.2vw, 10px);
            cursor: pointer;
            font-size: clamp(10px, 1.1vw, 11px);
            transition: all 0.3s ease;
        }

        .login-type-btn.active {
            background: #333;
            color: #ffffff;
        }

        .primary-btn {
            width: 100%;
            background: #ffffff;
            color: #000;
            border: none;
            padding: clamp(10px, 1.3vw, 12px);
            border-radius: 8px;
            font-size: clamp(12px, 1.3vw, 13px);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: clamp(15px, 1.8vw, 18px);
        }

        .primary-btn:hover {
            background: #f0f0f0;
            transform: translateY(-1px);
        }

        .google-btn {
            width: 100%;
            background: #1a1a1a;
            color: #ffffff;
            border: 1px solid #333;
            padding: clamp(10px, 1.3vw, 12px);
            border-radius: 8px;
            font-size: clamp(12px, 1.3vw, 13px);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(6px, 0.8vw, 8px);
            margin-bottom: clamp(20px, 2.5vw, 25px);
        }

        .google-btn:hover {
            background: #222;
            border-color: #444;
        }

        .divider {
            text-align: center;
            margin: clamp(15px, 2vw, 20px) 0;
            position: relative;
            color: #666;
            font-size: clamp(10px, 1.1vw, 11px);
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #333;
            z-index: 1;
        }

        .divider span {
            background: #111;
            padding: 0 clamp(10px, 1.3vw, 12px);
            position: relative;
            z-index: 2;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            margin-bottom: clamp(15px, 1.8vw, 18px);
            gap: clamp(5px, 0.8vw, 6px);
        }

        .checkbox-group input {
            margin-top: 2px;
            flex-shrink: 0;
        }

        .checkbox-group label {
            color: #888;
            font-size: clamp(10px, 1.1vw, 11px);
            line-height: 1.4;
        }

        /* Error and Success Message Styles */
        .error-message, .success-message {
            padding: clamp(8px, 1.2vw, 10px) clamp(12px, 1.4vw, 14px);
            border-radius: 8px;
            margin-bottom: clamp(15px, 1.8vw, 18px);
            font-size: clamp(11px, 1.2vw, 12px);
            display: none;
        }

        .error-message {
            background: #ff4444;
            color: white;
        }

        .success-message {
            background: #00aa44;
            color: white;
        }

        /* Mobile and Tablet Responsive Design */
        @media (max-width: 1024px) {
            .left-side {
                display: none;
            }
            
            .container {
                justify-content: center;
                align-items: center;
                background: #111111;
            }
            
            .right-side {
                flex: none;
                width: 100%;
                max-width: 450px;
                border-left: none;
                padding: clamp(20px, 5vw, 40px);
                margin: 0 auto;
            }

            .login-container {
                max-width: 100%;
                height: auto;
                max-height: 90vh;
                overflow-y: auto;
            }
        }

        @media (max-width: 768px) {
            .right-side {
                padding: clamp(15px, 4vw, 25px);
                max-width: 400px;
            }

            .welcome-title {
                font-size: clamp(20px, 4vw, 24px);
            }
        }

        @media (max-width: 480px) {
            .right-side {
                padding: clamp(15px, 5vw, 20px);
                max-width: 350px;
            }

            .login-container {
                max-height: 85vh;
                padding: 0;
            }

            .form-group {
                margin-bottom: clamp(12px, 2.5vw, 15px);
            }

            .auth-tabs {
                margin-bottom: clamp(15px, 3vw, 20px);
            }
        }

        @media (max-width: 360px) {
            .right-side {
                padding: clamp(10px, 4vw, 15px);
                max-width: 320px;
            }
        }

        /* Desktop specific adjustments */
        @media (min-width: 1025px) {
            .spline-container {
                width: min(60vw, 600px);
                height: min(45vh, 450px);
            }
        }

        @media (min-width: 1200px) {
            .spline-container {
                width: min(70vw, 700px);
                height: min(50vh, 500px);
            }
        }

        /* Landscape orientation adjustments for mobile */
        @media (max-height: 600px) and (orientation: landscape) and (max-width: 1024px) {
            .login-container {
                max-height: 95vh;
                overflow-y: auto;
            }
            
            .welcome-header {
                margin-bottom: clamp(15px, 2vw, 20px);
            }
            
            .form-group {
                margin-bottom: clamp(10px, 1.5vw, 12px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Left Side - 3D Model & Branding -->
        <div class="left-side">
            <div class="brand-section">
                <div class="brand-logo">
                    <i class="fas fa-globe-americas"></i>
                    <div class="brand-name">NeerVerse</div>
                </div>
                <!-- Added translation attributes -->
                <div class="brand-subtitle" data-translate="login.brand.subtitle">Crowdsourced Reporting Assistant</div>
                <div class="brand-description" data-translate="login.brand.description">
                    Your ultimate platform for community-driven reporting with real-time tracking, advanced analytics, and collaborative features.
                </div>
            </div>

            <div class="spline-container">
                <spline-viewer url="https://prod.spline.design/wcYWE2xXU5oJTMKQ/scene.splinecode"></spline-viewer>
            </div>
        </div>

        <!-- Right Side - Login Form -->
        <div class="right-side">
            <div class="login-container">
                <div class="welcome-header">
                    <!-- Added translation attributes -->
                    <h1 class="welcome-title" data-translate="login.welcome">Welcome to NeerVerse</h1>
                    <p class="welcome-subtitle" data-translate="login.subtitle">Sign in to access your reporting dashboard</p>
                </div>

                <!-- Tab Navigation -->
                <div class="auth-tabs">
                    <!-- Added translation attributes -->
                    <button class="tab-btn active" onclick="switchTab('signin')" data-translate="login.signin">Sign In</button>
                    <button class="tab-btn" onclick="switchTab('signup')" data-translate="login.signup">Sign Up</button>
                </div>

                <!-- Sign In Form -->
                <div id="signin-form" class="auth-form active">
                    <!-- Added translation attribute -->
                    <button class="google-btn" onclick="handleGoogleLogin()">
                        <i class="fab fa-google"></i>
                        <span data-translate="login.google">Continue with Google</span>
                    </button>

                    <div class="divider">
                        <!-- Added translation attribute -->
                        <span data-translate="login.or">OR</span>
                    </div>

                    <div class="login-type-selector">
                        <button class="login-type-btn active" onclick="switchLoginType('email')">
                            <!-- Added translation attribute -->
                            <i class="fas fa-envelope"></i> <span data-translate="login.email">Email</span>
                        </button>
                        <button class="login-type-btn" onclick="switchLoginType('phone')">
                            <!-- Added translation attribute -->
                            <i class="fas fa-phone"></i> <span data-translate="login.phone">Phone</span>
                        </button>
                    </div>

                    <form onsubmit="handleSignIn(event)">
                        <div class="form-group">
                            <!-- Added translation attribute -->
                            <label class="form-label" id="signin-label" data-translate="login.email">Email</label>
                            <input type="email" id="signin-input" class="form-input" placeholder="demo@neerverse.gg" required>
                        </div>

                        <div class="form-group">
                            <!-- Added translation attribute -->
                            <label class="form-label" data-translate="login.password">Password</label>
                            <input type="password" id="signin-password" class="form-input" placeholder="••••••••" required>
                        </div>

                        <!-- Added translation attribute -->
                        <button type="submit" class="primary-btn" data-translate="login.signin">Sign In</button>
                    </form>
                </div>

                <!-- Sign Up Form -->
                <div id="signup-form" class="auth-form">
                    <!-- Added translation attribute -->
                    <button class="google-btn" onclick="handleGoogleLogin()">
                        <i class="fab fa-google"></i>
                        <span data-translate="login.google">Continue with Google</span>
                    </button>

                    <div class="divider">
                        <!-- Added translation attribute -->
                        <span data-translate="login.or">OR</span>
                    </div>

                    <form onsubmit="handleSignUp(event)">
                        <div class="form-group">
                            <!-- Added translation attribute -->
                            <label class="form-label" data-translate="login.fullname">Full Name</label>
                            <input type="text" id="signup-name" class="form-input" placeholder="Enter your full name" required>
                        </div>

                        <div class="form-group">
                            <!-- Added translation attribute -->
                            <label class="form-label" data-translate="login.email">Email</label>
                            <input type="email" id="signup-email" class="form-input" placeholder="Enter your email" required>
                        </div>

                        <div class="form-group">
                            <!-- Added translation attribute -->
                            <label class="form-label" data-translate="login.password">Password</label>
                            <input type="password" id="signup-password" class="form-input" placeholder="Create a password" required>
                        </div>

                        <div class="checkbox-group">
                            <input type="checkbox" id="terms" required>
                            <!-- Added translation attribute -->
                            <label for="terms" data-translate="login.terms">I agree to the Terms of Service and Privacy Policy</label>
                        </div>

                        <!-- Added translation attribute -->
                        <button type="submit" class="primary-btn" data-translate="login.createaccount">Create Account</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Remove Spline logo
        setInterval(() => {
            const viewer = document.querySelector('spline-viewer');
            if (viewer && viewer.shadowRoot) {
                const logo = viewer.shadowRoot.querySelector('#logo');
                if (logo) logo.remove();
            }
        }, 50);

        // Tab switching functionality
        function switchTab(tab) {
            // Update tab buttons
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // Update forms
            document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));
            document.getElementById(tab + '-form').classList.add('active');
        }

        // Login type switching (Email/Phone)
        function switchLoginType(type) {
            document.querySelectorAll('.login-type-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const label = document.getElementById('signin-label');
            const input = document.getElementById('signin-input');

            if (type === 'email') {
                label.textContent = window.translationManager?.translate('login.email') || 'Email';
                input.type = 'email';
                input.placeholder = 'demo@neerverse.gg';
            } else {
                label.textContent = window.translationManager?.translate('login.phone') || 'Phone Number';
                input.type = 'tel';
                input.placeholder = '+91 98765 43210';
            }
        }

        async function handleSignIn(event) {
            event.preventDefault();
            
            const email = document.getElementById('signin-input').value;
            const password = document.getElementById('signin-password').value;
            const btn = event.target.querySelector('.primary-btn');
            const originalText = btn.textContent;
            
            // Show loading state
            window.firebaseAuth.setButtonLoading(btn, true, originalText);
            
            try {
                const result = await window.firebaseAuth.signInWithEmail(email, password);
                
                if (result.success) {
                    window.firebaseAuth.showSuccess('Sign in successful! Redirecting...');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    window.firebaseAuth.showError(result.error);
                    window.firebaseAuth.setButtonLoading(btn, false, originalText);
                }
            } catch (error) {
                window.firebaseAuth.showError('An unexpected error occurred. Please try again.');
                window.firebaseAuth.setButtonLoading(btn, false, originalText);
            }
        }

        async function handleSignUp(event) {
            event.preventDefault();
            
            const fullName = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const btn = event.target.querySelector('.primary-btn');
            const originalText = btn.textContent;
            
            // Show loading state
            window.firebaseAuth.setButtonLoading(btn, true, originalText);
            
            try {
                const result = await window.firebaseAuth.signUpWithEmail(email, password, fullName);
                
                if (result.success) {
                    window.firebaseAuth.showSuccess('Account created successfully! Welcome to Neerverse!');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    window.firebaseAuth.showError(result.error);
                    window.firebaseAuth.setButtonLoading(btn, false, originalText);
                }
            } catch (error) {
                window.firebaseAuth.showError('An unexpected error occurred. Please try again.');
                window.firebaseAuth.setButtonLoading(btn, false, originalText);
            }
        }

        async function handleGoogleLogin() {
            try {
                const result = await window.firebaseAuth.signInWithGoogle();
                
                if (result.success) {
                    window.firebaseAuth.showSuccess('Google sign in successful! Redirecting...');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    window.firebaseAuth.showError(result.error);
                }
            } catch (error) {
                window.firebaseAuth.showError('Google sign in failed. Please try again.');
            }
        }

        // Add some interactive feedback
        document.querySelectorAll('.form-input').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'translateY(-2px)';
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'translateY(0)';
            });
        });

        document.addEventListener('DOMContentLoaded', () => {
            const storedUser = window.firebaseAuth?.getStoredUser();
            if (storedUser) {
                // User is already signed in, redirect to main page
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
